[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jul"
version = "0.1.0"
description = "Juste Un LLM - local typed decisions with the interface of the TypeSafe (Jev) SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mlx>=0.32", "mlx-lm>=0.31", "numpy>=1.24"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
lab = ["pyyaml>=6", "datasets", "pyarrow"]
# Everything needed to re-run the measurements in README > Reproducing.
repro = ["pyyaml>=6", "datasets", "pyarrow", "pytest>=8", "scikit-learn>=1.3"]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
jul = "jul_cli.main:main"

[tool.setuptools]
package-dir = {"jul" = "lib/jul", "jul.lab" = "lib/jul/lab", "jul_cli" = "cli/jul_cli"}
packages = ["jul", "jul.lab", "jul_cli"]

[tool.setuptools.package-data]
jul = ["assets/*.npy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads a model; run with JUL_SLOW=1"]
