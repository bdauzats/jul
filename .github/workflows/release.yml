name: Release

# One build; the version comes from git (setuptools-scm), never from a file edited by hand:
#
#   push to main                  -> <next patch>.dev<commits since the last tag>, e.g. 0.1.2.dev7:
#                                    the unstable channel, on TestPyPI (when PUBLISH_TESTPYPI is true)
#   push of a tag v0.2.0rc1       -> 0.2.0rc1 (any pre-release: aN, bN, rcN, .devN) on TestPyPI
#   push of a tag v0.2.0          -> 0.2.0 on PyPI
#
# pip sorts 0.1.2.dev7 after 0.1.1 and before 0.1.2, and only installs it with --pre.
# The same artifact is built, checked and installed in a clean environment before either upload, so
# a broken sdist or a missing asset fails here and not in somebody's `pip install`.
#
# Uploads use PyPI Trusted Publishing (OIDC): no API token lives in this repo. Each index needs a
# publisher declared once on its side. docs/publishing.md has the setup and the reasoning.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # setuptools-scm needs the tags and the history since the last one

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          pip install build twine packaging
          python -m build

      # What was built, and on a tag, that it is exactly the tag: a tag on a commit that is not the
      # one checked out, or a dirty tree, would give a .devN instead.
      - name: The version built
        id: version
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import os, pathlib, sys
          from packaging.version import Version
          sdist = next(pathlib.Path("dist").glob("jul-*.tar.gz")).name
          version = sdist.removeprefix("jul-").removesuffix(".tar.gz")
          tag = os.environ["TAG"].removeprefix("v")
          if tag and Version(tag) != Version(version):
              sys.exit(f"tag {tag!r} but the build is {version!r}")
          pre = Version(version).is_prerelease
          print(f"built {version} ({'pre-release' if pre else 'release'})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\nprerelease={str(pre).lower()}\n")
          PY

      - name: Metadata is renderable on the index page
        run: twine check --strict dist/*

      # An sdist that cannot build a wheel is an sdist nobody can install from source. The package
      # data lives outside the package directory (lib/jul/assets), which is exactly the arrangement
      # that goes missing from an sdist, so this check earns its 30 seconds.
      - name: The sdist alone can build the wheel
        run: |
          mkdir -p /tmp/from-sdist
          tar xzf dist/*.tar.gz -C /tmp/from-sdist --strip-components=1
          cd /tmp/from-sdist
          python -m build --wheel --outdir /tmp/from-sdist/dist
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("/tmp/from-sdist/dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          missing = [n for n in ("jul/assets/minicpm5-2b.one_word.center.npy",
                                 "jul/assets/presets/minicpm5-2b@torch.json")
                     if n not in names]
          if missing:
              raise SystemExit(f"rebuilt from the sdist, these are gone: {missing}")
          print(f"{wheel.name} rebuilt from the sdist with its assets")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The install a stranger does: the wheel, no extras, no checkout in sight. Catches an asset that
  # never made it into the wheel and an import that quietly needs a backend.
  smoke:
    name: install the wheel (${{ matrix.os }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.10"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: macos-15, python: "3.13"}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: pip install the wheel
        run: pip install dist/*.whl

      - name: It imports, it carries its assets, it needs no backend
        env:
          EXPECTED: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import importlib.util as u, os, pathlib, sys
          import jul

          assert jul.__version__ == os.environ["EXPECTED"], \
              f"installed {jul.__version__}, built {os.environ['EXPECTED']}"

          assets = pathlib.Path(jul.__file__).parent / "assets"
          for name in ("minicpm5-2b.one_word.center.npy", "presets/minicpm5-2b@torch.json"):
              assert (assets / name).is_file(), f"{name} missing from the installed package"

          for backend in ("mlx", "torch"):
              assert u.find_spec(backend) is None, f"{backend} came in with the base install"

          from jul import TypeSafeClient, Choice, Context      # noqa: F401
          print(f"jul {jul.__version__} installed and importable on {sys.version.split()[0]}")
          PY

      - name: The console script is on PATH
        run: |
          jul --help
          jul models

  testpypi:
    name: publish to TestPyPI
    needs: [build, smoke]
    # the unstable channel (a push to main) and pre-release tags; a manual run never uploads
    if: >-
      github.event_name == 'push' && (
        (github.ref == 'refs/heads/main' && vars.PUBLISH_TESTPYPI == 'true') ||
        (startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.prerelease == 'true'))
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jul
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  pypi:
    name: publish to PyPI
    needs: [build, smoke]
    # a final tag pushed: v0.2.0; a manual run never uploads
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/jul
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          print-hash: true
